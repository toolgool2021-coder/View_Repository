<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>View Repository</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #08080b;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 25px 15px 100px;
}

.app {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

.header {
    margin-bottom: 22px;
}

.title {
    font-size: 28px;
    font-weight: 700;
}

.subtitle {
    margin-top: 6px;
    color: #777783;
    font-size: 14px;
}

.repo {
    display: inline-block;
    margin-top: 12px;
    padding: 7px 10px;
    border: 1px solid #24242c;
    border-radius: 9px;
    background: #111116;
    color: #888893;
    font-size: 12px;
}

.status {
    margin-bottom: 12px;
    color: #777783;
    font-size: 13px;
}

.list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.file {
    padding: 15px;
    border: 1px solid #22222a;
    border-radius: 13px;
    background: #101014;
    cursor: pointer;
    transition: .18s;
}

.file:hover {
    background: #15151b;
    border-color: #393942;
}

.file.selected {
    background: #171420;
    border-color: #735cff;
    box-shadow: 0 0 0 1px rgba(115, 92, 255, .15);
}

.name {
    font-size: 15px;
    font-weight: 600;
}

.path {
    margin-top: 5px;
    color: #70707b;
    font-size: 12px;
    word-break: break-all;
}

.loading,
.empty,
.error {
    padding: 25px;
    border: 1px solid #24242b;
    border-radius: 13px;
    background: #101014;
    color: #777783;
    text-align: center;
}

.error {
    color: #c7838d;
    text-align: left;
}

.bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 15px;
    background: linear-gradient(to top, #08080b 65%, transparent);
}

.open {
    display: block;
    width: min(700px, 100%);
    margin: auto;
    padding: 15px;
    border: 0;
    border-radius: 13px;
    background: #735cff;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.open:disabled {
    background: #22222a;
    color: #666670;
    cursor: not-allowed;
}

@media (max-width: 500px) {
    .title {
        font-size: 24px;
    }
}
</style></head><body><div class="app"><div class="header">
    <div class="title" id="title">View Repository</div>

    <div class="subtitle">
        Выберите HTML версию
    </div>

    <div class="repo" id="repo">
        Загрузка...
    </div>
</div>

<div class="status" id="status">
    Поиск HTML файлов...
</div>

<div class="list" id="list">
    <div class="loading">
        Загрузка репозитория...
    </div>
</div>

</div><div class="bottom">
    <button class="open" id="open" disabled>
        Открыть выбранную версию
    </button>
</div><script>

const list = document.getElementById("list");
const status = document.getElementById("status");
const repoElement = document.getElementById("repo");
const titleElement = document.getElementById("title");
const openButton = document.getElementById("open");

let owner = "";
let repository = "";
let selectedFile = "";

function detectRepository() {

    const host = location.hostname;

    if (!host.endsWith(".github.io")) {
        throw new Error(
            "Открой этот файл через GitHub Pages."
        );
    }

    owner = host.replace(".github.io", "");

    const parts = location.pathname
        .split("/")
        .filter(Boolean);

    if (parts.length === 0) {
        repository = owner + ".github.io";
    } else {
        repository = parts[0];
    }
}

async function loadRepository() {

    try {

        detectRepository();

        titleElement.textContent = repository;

        repoElement.textContent =
            owner + "/" + repository;

        const repoResponse = await fetch(
            "https://api.github.com/repos/" +
            encodeURIComponent(owner) +
            "/" +
            encodeURIComponent(repository)
        );

        if (!repoResponse.ok) {
            throw new Error(
                "Не удалось получить репозиторий."
            );
        }

        const repoData = await repoResponse.json();

        const branch = repoData.default_branch;

        const treeResponse = await fetch(
            "https://api.github.com/repos/" +
            encodeURIComponent(owner) +
            "/" +
            encodeURIComponent(repository) +
            "/git/trees/" +
            encodeURIComponent(branch) +
            "?recursive=1"
        );

        if (!treeResponse.ok) {
            throw new Error(
                "Не удалось получить список файлов."
            );
        }

        const treeData = await treeResponse.json();

        const htmlFiles = treeData.tree
            .filter(file => {
                return (
                    file.type === "blob" &&
                    file.path.toLowerCase().endsWith(".html")
                );
            })
            .sort((a, b) =>
                a.path.localeCompare(
                    b.path,
                    undefined,
                    {
                        numeric: true,
                        sensitivity: "base"
                    }
                )
            );

        if (htmlFiles.length === 0) {

            status.textContent =
                "HTML файлов не найдено.";

            list.innerHTML = `
                <div class="empty">
                    В репозитории нет HTML файлов.
                </div>
            `;

            return;
        }

        status.textContent =
            "Найдено HTML файлов: " +
            htmlFiles.length;

        list.innerHTML = "";

        htmlFiles.forEach(file => {

            const element =
                document.createElement("div");

            element.className = "file";

            const fileName =
                file.path.split("/").pop();

            element.innerHTML = `
                <div class="name">
                    ${escapeHTML(fileName)}
                </div>

                <div class="path">
                    ${escapeHTML(file.path)}
                </div>
            `;

            element.addEventListener("click", () => {

                document
                    .querySelectorAll(".file")
                    .forEach(item => {
                        item.classList.remove("selected");
                    });

                element.classList.add("selected");

                selectedFile = file.path;

                openButton.disabled = false;
            });

            list.appendChild(element);
        });

    } catch (error) {

        status.textContent = "Ошибка";

        list.innerHTML = `
            <div class="error">
                ${escapeHTML(error.message)}
            </div>
        `;
    }
}

function escapeHTML(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

openButton.addEventListener("click", () => {

    if (!selectedFile) {
        return;
    }

    /*
        ВАЖНО:

        Здесь НЕ загружается HTML как текст.

        Мы формируем настоящий URL GitHub Pages
        и полностью переходим на выбранный HTML.
    */

    const encodedPath = selectedFile
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    const url =
        "https://" +
        owner +
        ".github.io/" +
        repository +
        "/" +
        encodedPath;

    window.location.href = url;
});

loadRepository();

</script></body>
</html>

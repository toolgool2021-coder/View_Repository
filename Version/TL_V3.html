<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TLWebsite</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050507;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 58px;
            min-height: 58px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            background: rgba(10, 10, 14, 0.88);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            user-select: none;
        }

        .logo-mark {
            width: 31px;
            height: 31px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #17171e, #29203d);
            border: 1px solid rgba(160, 110, 255, 0.25);
            box-shadow: 0 0 22px rgba(130, 70, 255, 0.12);
            font-size: 14px;
            font-weight: 800;
        }

        .logo-text {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .logo-text span {
            color: #9270ff;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.035);
            color: #ddd;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            transition: 0.18s ease;
        }

        .icon-btn:hover {
            background: rgba(145, 100, 255, 0.12);
            border-color: rgba(145, 100, 255, 0.35);
            color: #fff;
            transform: translateY(-1px);
        }

        .icon-btn:active {
            transform: scale(0.94);
        }

        /* =========================
           SITE FRAME
        ========================= */

        .site-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 58px);
            overflow: hidden;
            background: #000;
        }

        #siteFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            position: absolute;
            inset: 0;
            z-index: 50;
            background: #050507;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 17px;
            transition: opacity 0.25s ease;
        }

        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: #9571ff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #888;
            font-size: 13px;
        }

        /* =========================
           DRAWER
        ========================= */

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.58);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: absolute;
            right: 0;
            top: 0;
            width: min(390px, 92vw);
            height: 100%;
            background: #0b0b10;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.45);
            transform: translateX(100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .drawer-overlay.open .drawer {
            transform: translateX(0);
        }

        .drawer-header {
            min-height: 62px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .drawer-title {
            font-size: 15px;
            font-weight: 700;
        }

        .repo-name {
            margin-top: 3px;
            font-size: 11px;
            color: #777;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .file-item {
            width: 100%;
            min-height: 40px;
            border: none;
            background: transparent;
            color: #bbb;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: 9px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            transition: 0.15s ease;
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.045);
            color: #fff;
        }

        .file-icon {
            width: 20px;
            text-align: center;
            opacity: 0.8;
        }

        .folder {
            color: #a27cff;
        }

        .file-path {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-files {
            color: #666;
            font-size: 13px;
            padding: 20px 12px;
            line-height: 1.5;
        }

        /* =========================
           MODALS
        ========================= */

        .modal-bg {
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s ease;
        }

        .modal-bg.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            width: min(520px, 100%);
            background: #0d0d12;
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 17px;
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            transform: translateY(8px) scale(0.98);
            transition: 0.2s ease;
        }

        .modal-bg.open .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            padding: 17px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
        }

        .modal-body {
            padding: 18px;
        }

        .url-input {
            width: 100%;
            height: 45px;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            outline: none;
            background: #08080c;
            color: #eee;
            padding: 0 13px;
            font-size: 13px;
        }

        .url-input:focus {
            border-color: rgba(145, 100, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(145, 100, 255, 0.08);
        }

        .modal-hint {
            color: #666;
            font-size: 11px;
            line-height: 1.5;
            margin-top: 9px;
        }

        .modal-footer {
            padding: 13px 18px 18px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            height: 39px;
            padding: 0 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.045);
            color: #ccc;
            cursor: pointer;
            font-size: 12px;
            transition: 0.16s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .btn.primary {
            background: #7451d9;
            border-color: #8664ed;
            color: white;
        }

        .btn.primary:hover {
            background: #835fe8;
        }

        /* =========================
           FILE VIEWER
        ========================= */

        .viewer-modal {
            width: min(1100px, 100%);
            height: min(760px, 92vh);
            display: flex;
            flex-direction: column;
        }

        .viewer-content {
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #07070a;
        }

        .code {
            padding: 18px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            line-height: 1.6;
            color: #c9c9d0;
        }

        .preview-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            margin: auto;
            object-fit: contain;
        }

        /* =========================
           ERROR
        ========================= */

        .error-title {
            color: #ff7070;
        }

        .error-text {
            color: #999;
            line-height: 1.55;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {
            .topbar {
                padding: 0 9px;
            }

            .logo-text {
                font-size: 15px;
            }

            .icon-btn {
                width: 36px;
                height: 36px;
            }

            .actions {
                gap: 5px;
            }

            .drawer {
                width: 94vw;
            }

            .modal-bg {
                padding: 10px;
            }

            .modal {
                border-radius: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="logo">
            <div class="logo-mark">TL</div>

            <div class="logo-text">
                <span>TL</span>Website
            </div>
        </div>

        <div class="actions">

            <!-- Open repository -->
            <button
                class="icon-btn"
                id="openRepoBtn"
                title="Открыть репозиторий"
                aria-label="Открыть репозиторий">
                🔗
            </button>

            <!-- Reload -->
            <button
                class="icon-btn"
                id="reloadBtn"
                title="Перезагрузить"
                aria-label="Перезагрузить">
                ↻
            </button>

            <!-- Files -->
            <button
                class="icon-btn"
                id="filesBtn"
                title="Файлы"
                aria-label="Файлы">
                ☰
            </button>

        </div>
    </header>


    <!-- =========================
         SITE
    ========================== -->

    <main class="site-container">

        <iframe
            id="siteFrame"
            sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups allow-pointer-lock"
            referrerpolicy="no-referrer">
        </iframe>

        <div class="loading" id="loading">
            <div class="loader"></div>
            <div class="loading-text" id="loadingText">
                Загрузка сайта...
            </div>
        </div>

    </main>


    <!-- =========================
         DRAWER
    ========================== -->

    <div class="drawer-overlay" id="drawerOverlay">

        <aside class="drawer">

            <div class="drawer-header">

                <div>
                    <div class="drawer-title">
                        Файлы
                    </div>

                    <div class="repo-name" id="drawerRepo">
                        Репозиторий не выбран
                    </div>
                </div>

                <button
                    class="icon-btn"
                    id="closeDrawerBtn"
                    aria-label="Закрыть">
                    ×
                </button>

            </div>

            <div
                class="file-list"
                id="fileList">

                <div class="empty-files">
                    Репозиторий ещё не загружен.
                </div>

            </div>

        </aside>

    </div>


    <!-- =========================
         URL MODAL
    ========================== -->

    <div class="modal-bg" id="repoModal">

        <div class="modal">

            <div class="modal-header">

                <div class="modal-title">
                    Открыть GitHub репозиторий
                </div>

                <button
                    class="icon-btn"
                    id="closeRepoModal">
                    ×
                </button>

            </div>

            <div class="modal-body">

                <input
                    id="repoInput"
                    class="url-input"
                    type="text"
                    autocomplete="off"
                    placeholder="https://github.com/user/repository">

                <div class="modal-hint">
                    Можно вставить обычную ссылку на GitHub репозиторий.
                    Например: https://github.com/toolgool2021-coder/TLwebsite
                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn"
                    id="cancelRepoBtn">
                    Отмена
                </button>

                <button
                    class="btn primary"
                    id="loadRepoBtn">
                    Открыть
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         FILE VIEWER
    ========================== -->

    <div class="modal-bg" id="viewerModal">

        <div class="modal viewer-modal">

            <div class="modal-header">

                <div
                    class="modal-title"
                    id="viewerTitle">
                    Файл
                </div>

                <button
                    class="icon-btn"
                    id="closeViewerBtn">
                    ×
                </button>

            </div>

            <div
                class="viewer-content"
                id="viewerContent">
            </div>

        </div>

    </div>


    <!-- =========================
         ERROR MODAL
    ========================== -->

    <div class="modal-bg" id="errorModal">

        <div class="modal">

            <div class="modal-header">

                <div class="modal-title error-title">
                    Ошибка
                </div>

                <button
                    class="icon-btn"
                    id="closeErrorBtn">
                    ×
                </button>

            </div>

            <div class="modal-body">

                <div
                    class="error-text"
                    id="errorText">
                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn primary"
                    id="errorOkBtn">
                    Понятно
                </button>

            </div>

        </div>

    </div>


<script>
/* =========================================================
   TLWebsite
   ========================================================= */

/*
    Текущий репозиторий.
*/

let owner = "";
let repo = "";
let branch = "main";

let currentFilePath = "";


/* =========================================================
   ELEMENTS
   ========================================================= */

const siteFrame = document.getElementById("siteFrame");

const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");

const repoModal = document.getElementById("repoModal");
const repoInput = document.getElementById("repoInput");

const drawerOverlay = document.getElementById("drawerOverlay");
const fileList = document.getElementById("fileList");
const drawerRepo = document.getElementById("drawerRepo");

const viewerModal = document.getElementById("viewerModal");
const viewerTitle = document.getElementById("viewerTitle");
const viewerContent = document.getElementById("viewerContent");

const errorModal = document.getElementById("errorModal");
const errorText = document.getElementById("errorText");


/* =========================================================
   UI HELPERS
   ========================================================= */

function showLoading(text = "Загрузка сайта...") {
    loadingText.textContent = text;
    loading.classList.remove("hidden");
}


function hideLoading() {
    loading.classList.add("hidden");
}


function openModal(element) {
    element.classList.add("open");
}


function closeModal(element) {
    element.classList.remove("open");
}


function showError(message) {
    errorText.textContent = message;
    openModal(errorModal);
}


function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =========================================================
   PARSE GITHUB URL
   ========================================================= */

function parseGithubUrl(input) {

    let value = input.trim();

    if (!value) {
        throw new Error("Введите ссылку на GitHub репозиторий.");
    }

    /*
        Позволяем вводить:

        https://github.com/user/repo
        github.com/user/repo
        user/repo
    */

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    let url;

    try {
        url = new URL(value);
    } catch {
        throw new Error("Некорректная ссылка.");
    }

    if (url.hostname.toLowerCase() !== "github.com") {
        throw new Error("Нужна ссылка именно на GitHub репозиторий.");
    }

    const parts = url.pathname
        .split("/")
        .filter(Boolean);

    if (parts.length < 2) {
        throw new Error(
            "Не удалось определить владельца и название репозитория."
        );
    }

    return {
        owner: parts[0],
        repo: parts[1].replace(/\.git$/i, "")
    };
}


/* =========================================================
   JSDELIVR URL
   ========================================================= */

/*
    ВАЖНО:

    Здесь больше НЕТ raw.githubusercontent.com.

    Вместо него используется jsDelivr:

    https://cdn.jsdelivr.net/gh/user/repo@branch/file
*/

function rawUrl(path) {

    const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

    return (
        "https://cdn.jsdelivr.net/gh/" +
        encodeURIComponent(owner) +
        "/" +
        encodeURIComponent(repo) +
        "@" +
        encodeURIComponent(branch) +
        "/" +
        encodedPath
    );
}


/* =========================================================
   SAVE / LOAD
   ========================================================= */

function saveRepository() {

    localStorage.setItem(
        "tlwebsite_repo",
        JSON.stringify({
            owner,
            repo,
            branch
        })
    );
}


function loadSavedRepository() {

    try {

        const saved = JSON.parse(
            localStorage.getItem("tlwebsite_repo")
        );

        if (
            saved &&
            saved.owner &&
            saved.repo
        ) {
            owner = saved.owner;
            repo = saved.repo;
            branch = saved.branch || "main";

            return true;
        }

    } catch {}

    return false;
}


/* =========================================================
   OPEN REPOSITORY
   ========================================================= */

async function loadRepository(
    newOwner,
    newRepo,
    newBranch = "main"
) {

    owner = newOwner;
    repo = newRepo;
    branch = newBranch || "main";

    saveRepository();

    drawerRepo.textContent =
        owner + "/" + repo + " • " + branch;

    showLoading("Загрузка сайта...");

    /*
        Сам сайт загружается напрямую в iframe.

        Никакого srcdoc.
        Никакого DOMParser.
        Никакого переписывания CSS/JS.

        Поэтому браузер сам разрешает:

        ./style.css
        ./script.js
        ./images/...
        ./fonts/...
    */

    const indexUrl =
        rawUrl("index.html") +
        "?tlwebsite=" +
        Date.now();

    siteFrame.src = indexUrl;

    /*
        Дерево файлов загружаем отдельно.

        Даже если GitHub API недоступен,
        сам сайт всё равно продолжит работать.
    */

    loadFileTree();
}


/* =========================================================
   FILE TREE
   ========================================================= */

async function loadFileTree() {

    fileList.innerHTML = `
        <div class="empty-files">
            Загрузка списка файлов...
        </div>
    `;

    /*
        GitHub API нужен только для списка файлов.
        Он НЕ нужен для запуска самого сайта.
    */

    const apiUrl =
        "https://api.github.com/repos/" +
        encodeURIComponent(owner) +
        "/" +
        encodeURIComponent(repo) +
        "/git/trees/" +
        encodeURIComponent(branch) +
        "?recursive=1";

    try {

        const response = await fetch(apiUrl, {
            headers: {
                "Accept": "application/vnd.github+json"
            }
        });

        if (!response.ok) {
            throw new Error(
                "GitHub API вернул HTTP " +
                response.status
            );
        }

        const data = await response.json();

        if (!data.tree) {
            throw new Error(
                "GitHub не вернул список файлов."
            );
        }

        renderFileTree(data.tree);

    } catch (error) {

        fileList.innerHTML = `
            <div class="empty-files">
                Не удалось получить список файлов через GitHub API.

                <br><br>

                Сам сайт при этом продолжает работать.

                <br><br>

                Ошибка:
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


/* =========================================================
   RENDER FILE TREE
   ========================================================= */

function renderFileTree(tree) {

    fileList.innerHTML = "";

    const files = tree
        .filter(item => item.type === "blob")
        .sort((a, b) =>
            a.path.localeCompare(
                b.path,
                undefined,
                {
                    numeric: true,
                    sensitivity: "base"
                }
            )
        );

    if (!files.length) {

        fileList.innerHTML = `
            <div class="empty-files">
                В репозитории нет файлов.
            </div>
        `;

        return;
    }

    for (const file of files) {

        const button =
            document.createElement("button");

        button.className = "file-item";

        const isImage =
            /\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i
                .test(file.path);

        const isHtml =
            /\.html?$/i.test(file.path);

        let icon = "📄";

        if (isImage) {
            icon = "🖼️";
        } else if (isHtml) {
            icon = "🌐";
        } else if (/\.css$/i.test(file.path)) {
            icon = "🎨";
        } else if (/\.js$/i.test(file.path)) {
            icon = "📜";
        } else if (/\.json$/i.test(file.path)) {
            icon = "{}";
        }

        button.innerHTML = `
            <span class="file-icon">${icon}</span>
            <span class="file-path">
                ${escapeHtml(file.path)}
            </span>
        `;

        button.addEventListener(
            "click",
            () => openFile(file.path)
        );

        fileList.appendChild(button);
    }
}


/* =========================================================
   OPEN FILE
   ========================================================= */

async function openFile(path) {

    currentFilePath = path;

    /*
        HTML-файлы открываем как настоящий HTML.

        Это позволяет посмотреть страницу,
        а не её исходный код.
    */

    if (/\.html?$/i.test(path)) {

        closeModal(viewerModal);
        closeModal(drawerOverlay);

        showLoading("Открытие страницы...");

        siteFrame.src =
            rawUrl(path) +
            "?tlwebsite=" +
            Date.now();

        return;
    }


    /*
        Картинки.
    */

    if (
        /\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i
            .test(path)
    ) {

        viewerTitle.textContent = path;

        viewerContent.innerHTML = `
            <img
                class="preview-image"
                src="${escapeHtml(rawUrl(path))}"
                alt="${escapeHtml(path)}">
        `;

        openModal(viewerModal);
        return;
    }


    /*
        Остальные текстовые файлы.
    */

    try {

        viewerTitle.textContent = path;

        viewerContent.innerHTML = `
            <div class="code">
                Загрузка...
            </div>
        `;

        openModal(viewerModal);

        const response =
            await fetch(rawUrl(path));

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text = await response.text();

        viewerContent.innerHTML = `
            <pre class="code">${escapeHtml(text)}</pre>
        `;

    } catch (error) {

        viewerContent.innerHTML = `
            <div class="code">
                Не удалось открыть файл.

                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


/* =========================================================
   EVENTS
   ========================================================= */

document
    .getElementById("openRepoBtn")
    .addEventListener("click", () => {

        repoInput.value =
            owner && repo
                ? `https://github.com/${owner}/${repo}`
                : "";

        openModal(repoModal);

        setTimeout(() => {
            repoInput.focus();
            repoInput.select();
        }, 100);
    });


document
    .getElementById("closeRepoModal")
    .addEventListener("click", () => {
        closeModal(repoModal);
    });


document
    .getElementById("cancelRepoBtn")
    .addEventListener("click", () => {
        closeModal(repoModal);
    });


document
    .getElementById("loadRepoBtn")
    .addEventListener("click", async () => {

        try {

            const result =
                parseGithubUrl(repoInput.value);

            closeModal(repoModal);

            await loadRepository(
                result.owner,
                result.repo,
                "main"
            );

        } catch (error) {

            showError(error.message);
        }
    });


repoInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            document
                .getElementById("loadRepoBtn")
                .click();
        }

        if (event.key === "Escape") {
            closeModal(repoModal);
        }
    }
);


/* =========================================================
   DRAWER
   ========================================================= */

document
    .getElementById("filesBtn")
    .addEventListener("click", () => {
        drawerOverlay.classList.add("open");
    });


document
    .getElementById("closeDrawerBtn")
    .addEventListener("click", () => {
        drawerOverlay.classList.remove("open");
    });


drawerOverlay.addEventListener(
    "click",
    event => {

        if (event.target === drawerOverlay) {
            drawerOverlay.classList.remove("open");
        }
    }
);


/* =========================================================
   RELOAD
   ========================================================= */

document
    .getElementById("reloadBtn")
    .addEventListener("click", () => {

        if (!owner || !repo) {
            openModal(repoModal);
            return;
        }

        showLoading("Перезагрузка...");

        siteFrame.src =
            rawUrl("index.html") +
            "?tlwebsite=" +
            Date.now();

        loadFileTree();
    });


/* =========================================================
   VIEWER
   ========================================================= */

document
    .getElementById("closeViewerBtn")
    .addEventListener("click", () => {
        closeModal(viewerModal);
    });


/* =========================================================
   ERROR
   ========================================================= */

document
    .getElementById("closeErrorBtn")
    .addEventListener("click", () => {
        closeModal(errorModal);
    });


document
    .getElementById("errorOkBtn")
    .addEventListener("click", () => {
        closeModal(errorModal);
    });


/* =========================================================
   CLOSE MODALS BY BACKDROP
   ========================================================= */

repoModal.addEventListener(
    "click",
    event => {

        if (event.target === repoModal) {
            closeModal(repoModal);
        }
    }
);


viewerModal.addEventListener(
    "click",
    event => {

        if (event.target === viewerModal) {
            closeModal(viewerModal);
        }
    }
);


errorModal.addEventListener(
    "click",
    event => {

        if (event.target === errorModal) {
            closeModal(errorModal);
        }
    }
);


/* =========================================================
   IFRAME EVENTS
   ========================================================= */

siteFrame.addEventListener(
    "load",
    () => {

        hideLoading();
    }
);


siteFrame.addEventListener(
    "error",
    () => {

        hideLoading();

        showError(
            "Не удалось загрузить index.html.\n\n" +
            "Проверьте, что репозиторий существует, " +
            "является публичным и содержит index.html."
        );
    }
);


/* =========================================================
   STARTUP
   ========================================================= */

(async function startup() {

    /*
        Поддержка:

        ?repo=https://github.com/user/repo
    */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const queryRepo =
        params.get("repo");

    if (queryRepo) {

        try {

            const result =
                parseGithubUrl(queryRepo);

            await loadRepository(
                result.owner,
                result.repo,
                "main"
            );

            return;

        } catch (error) {

            showError(error.message);
            return;
        }
    }


    /*
        Загружаем последний использованный
        репозиторий.
    */

    if (loadSavedRepository()) {

        drawerRepo.textContent =
            owner + "/" + repo + " • " + branch;

        loadRepository(
            owner,
            repo,
            branch
        );

        return;
    }


    /*
        Если репозиторий не выбран,
        показываем окно выбора.
    */

    hideLoading();

    setTimeout(() => {

        openModal(repoModal);

    }, 150);

})();
</script>
